<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#667;--bd:#dde1ec;--ac:#3b5bdb;--ok:#2b9348;--no:#d62839;--okb:#e3f6e8;--nob:#fde8ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.2rem;margin:.3em 0}.mut{color:var(--mut);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:14px 0}

.f{cursor:pointer;text-align:left;color:inherit;font:inherit}.f:hover{border-color:var(--ac)}

</style></head><body><main id="app"></main>
<script>
var L=["B1","B2","C1","C2"];
var F=[
{n:"Tenses Master",i:"⏱️",les:"<p><b>Công thức nhanh:</b> HTĐ S+V(s/es) · HTTD S+am/is/are+V-ing · HTHT S+have/has+PP · HTHTTD S+have/has been+V-ing · QKĐ S+V2 · QKTD S+was/were+V-ing · QKHT S+had+PP · TLĐ will+V · TLTD will be+V-ing · TLHT will have+PP.</p><p><b>Dấu hiệu:</b> every day/usually (HTĐ) · now/at the moment (HTTD) · already/yet/ever/since/for (HTHT) · yesterday/ago (QKĐ) · when/while (QKTD) · before/by the time (QKHT) · by + mốc tương lai (TLHT) · this time tomorrow (TLTD).</p><p><b>Bẫy IOE:</b> sau when/if/by the time/as soon as KHÔNG dùng will; since + mốc, for + khoảng; động từ trạng thái (know, like, believe) không chia tiếp diễn.</p>",
q:[["B1","She ___ to school every day.","go|goes|is going|went",1,"“every day” → Hiện tại đơn, chủ ngữ she thêm -s."],
["B1","I ___ TV when you called.","watched|was watching|watch|have watched",1,"Hành động đang diễn ra (QKTD) bị hành động ngắn (QKĐ) cắt ngang."],
["B2","I ___ English for five years.","learn|am learning|have been learning|was learning",2,"“for five years” + nhấn mạnh quá trình kéo dài → HTHT tiếp diễn."],
["C1","By the time she arrives, we ___ dinner.","finish|will finish|will have finished|have finished",2,"By the time + HTĐ → mệnh đề chính dùng Tương lai hoàn thành."],
["C2","This time next week, I ___ on a beach in Bali.","lie|will lie|will be lying|will have lain",2,"“this time next week” = đang diễn ra tại một thời điểm tương lai → TLTD."],
["B1","He ___ his homework at the moment.","does|is doing|did|has done",1,"“at the moment” → HTTD."],
["B1","They ___ to Da Nang last summer.","go|went|have gone|were going",1,"“last summer” → QKĐ."],
["B2","She ___ yet.","hasn’t arrived|didn’t arrive|doesn’t arrive|wasn’t arriving",0,"“yet” → HTHT."],
["B2","When I got to the station, the train ___.","left|had left|has left|was leaving",1,"Xảy ra trước một mốc quá khứ → QKHT."],
["B2","I ___ you as soon as I get there.","call|will call|am calling|called",1,"Sau as soon as dùng HTĐ, mệnh đề chính TLĐ."],
["C1","Look at those dark clouds! It ___ rain.","will|is going to|is|would",1,"Dự đoán có căn cứ hiện tại → be going to."],
["C1","She ___ for two hours when he finally arrived.","has been waiting|had been waiting|was waiting|waited",1,"QKHT tiếp diễn: kéo dài trước mốc quá khứ."],
["C2","By next June, she ___ here for ten years.","will work|will have been working|is working|works",1,"By + mốc tương lai + for → TLHT tiếp diễn."],
["C2","Bẫy: “I ___ him since 2010.”","know|knew|have known|am knowing",2,"since → HTHT; know là động từ trạng thái, không chia tiếp diễn."]]},
{n:"Passive Voice",i:"🔁",les:"<p><b>Công thức:</b> be + PP. Hiện tại: is/are PP · Quá khứ: was/were PP · Tương lai: will be PP · Modal: modal + be + PP · Tiếp diễn: is/are being PP · Hoàn thành: has/have been PP.</p><p><b>Reporting passive:</b> It is said that… = S + is said + to V / to have PP (nếu hành động xảy ra trước).</p><p><b>Causative:</b> have/get + O + PP (nhờ người làm) · have + O + V (chủ động).</p><p><b>Lỗi thường gặp:</b> quên be, chia sai PP, bị động hóa nội động từ (happen, arrive), quên by-agent khi cần.</p>",
q:[["B1","The window ___ yesterday.","broke|was broken|is broken|has broken",1,"Quá khứ bị động: was/were + PP."],
["B2","This report must ___ by Friday.","finish|be finished|been finished|being finished",1,"Modal bị động: modal + be + PP."],
["B2","They are building a new bridge. → A new bridge ___.","is built|is being built|has built|was built",1,"HTTD bị động: is/are being + PP."],
["C1","I had my car ___ yesterday.","repair|repaired|to repair|repairing",1,"Causative: have + O + PP."],
["C2","People believe he stole the car. → He is believed ___ the car.","stealing|to steal|to have stolen|to be stolen",2,"“stole” xảy ra trước “believe” → to have + PP."],
["B1","English ___ all over the world.","speaks|is spoken|spoke|is speaking",1,"Bị động HTĐ: is/are + PP."],
["B2","The thief ___ by the police last night.","caught|was caught|is caught|has caught",1,"QKĐ bị động."],
["B2","The project will ___ next month.","complete|be completed|completing|have completed",1,"will be + PP."],
["B2","Active → Passive: “Someone has stolen my phone.” → My phone ___.","is stolen|has been stolen|was stolen|has stolen",1,"HTHT bị động: has/have been + PP."],
["C1","Passive → Active: “The lesson was being taught by Mr. Nam.” → Mr. Nam ___ the lesson.","taught|was teaching|has taught|teaches",1,"was being taught → was teaching."],
["C1","I’m going to have my hair ___ tomorrow.","cut|cutting|to cut|cuts",0,"Causative: have + O + PP."],
["C2","They say the company lost millions. → The company is said ___ millions.","to lose|to have lost|losing|to be lost",1,"lost xảy ra trước “say” → to have + PP."],
["C2","Chọn câu đúng:","The accident happened yesterday.|The accident was happened yesterday.|The accident is happened yesterday.|The accident had been happened yesterday.",0,"happen là nội động từ, không có bị động."]]},
{n:"Conditionals",i:"🌿",les:"<p><b>Sơ đồ tư duy:</b> Type 0: If+HTĐ, HTĐ (chân lý) → Type 1: If+HTĐ, will+V (có thể xảy ra) → Type 2: If+QKĐ, would+V (không có thật hiện tại; be → <i>were</i>) → Type 3: If+had PP, would have PP (trái quá khứ) → Mixed: If+had PP, would+V (quá khứ → hiện tại).</p><p><b>Đảo ngữ:</b> Were I… / Had I… / Should you… = If.</p><p><b>Wish:</b> hiện tại → QKĐ; quá khứ → had PP; tương lai → would+V.</p><p><b>Bẫy:</b> không dùng would sau if (trừ lịch sự); unless = if… not.</p>",
q:[["B1","If you heat ice, it ___.","melt|melts|will melt|melted",1,"Type 0: chân lý khoa học → HTĐ cả hai vế."],
["B1","If it rains, we ___ at home.","stay|stayed|will stay|would stay",2,"Type 1: If + HTĐ, will + V."],
["B2","If she had studied, she ___ the exam.","would pass|would have passed|will pass|had passed",1,"Type 3: would have + PP."],
["C1","If I had taken the job, I ___ in Hanoi now.","would live|would have lived|will live|lived",0,"Mixed: điều kiện quá khứ, kết quả hiện tại (“now”)."],
["C2","___ it not been for your help, I would have failed.","Were|Had|Should|Unless",1,"Đảo ngữ Type 3: Had + S + (not) + PP."],
["C2","I wish I ___ the answer yesterday.","know|knew|had known|would know",2,"Wish về quá khứ → had + PP."],
["B1","If I ___ rich, I would buy a big house.","am|were|will be|have been",1,"Type 2: If + QKĐ (be → were)."],
["B1","If you study hard, you ___ the exam.","pass|passed|will pass|would pass",2,"Type 1: will + V."],
["B2","If he ___ earlier, he wouldn’t have missed the bus.","left|had left|would leave|leaves",1,"Type 3: If + had PP."],
["B2","You will fail ___ you study harder.","unless|if|when|because",0,"unless = if … not."],
["C1","If it ___ for the traffic, we would have arrived on time.","isn’t|weren’t|hadn’t been|wasn’t",2,"If it hadn’t been for = nếu không nhờ/vì."],
["C1","___ you need help, call me.","Should|Were|Had|Unless",0,"Đảo ngữ Type 1: Should + S + V."],
["C2","But for your help, I ___ the exam.","would fail|would have failed|will fail|failed",1,"But for = Had it not been for → Type 3."],
["C2","It’s high time you ___ to bed.","go|went|had gone|will go",1,"It’s (high) time + QKĐ."]]},
{n:"Reported Speech",i:"💬",les:"<p><b>Lùi thì:</b> am/is/are → was/were · V1 → V2 · will → would · can → could · have PP → had PP · V2 → had PP.</p><p><b>Đổi đại từ:</b> I → he/she (theo chủ ngữ), my → his/her, you → I/he (theo ngữ cảnh).</p><p><b>Đổi trạng từ:</b> now → then · today → that day · tomorrow → the next day · yesterday → the day before · here → there · this → that · ago → before.</p><p><b>Câu hỏi:</b> Wh-/if/whether + S + V (không đảo ngữ). <b>Mệnh lệnh:</b> told/asked + O + (not) to V.</p><p><b>Reporting verbs:</b> admit/deny/suggest + V-ing · promise/refuse/offer + to V · accuse O of V-ing.</p>",
q:[["B1","She said, “I am tired.” → She said she ___ tired.","is|was|were|be",1,"Lùi thì: am → was, I → she."],
["B2","He asked me, “Where do you live?” → He asked me where ___.","do you live|I lived|did you live|you live",1,"Câu hỏi gián tiếp: trật tự câu khẳng định + lùi thì (đại từ đổi theo ngữ cảnh)."],
["B2","“Don’t be late,” she told me. → She told me ___ late.","not to be|don’t be|to not be|not being",0,"Mệnh lệnh phủ định: told + O + not to V."],
["B2","“I will come tomorrow.” → He said he would come ___.","tomorrow|the next day|yesterday|next day",1,"tomorrow → the next day / the following day."],
["C1","“I didn’t steal the money.” → He ___ stealing the money.","suggested|denied|refused|promised",1,"deny + V-ing; refuse/promise + to V."],
["C2","He said, “The earth moves round the sun.” → He said that the earth ___ round the sun.","moved|moves|had moved|would move",1,"Chân lý không lùi thì."],
["B1","“I like pizza,” he said. → He said he ___ pizza.","likes|liked|had liked|would like",1,"Lùi thì: like → liked."],
["B2","She asked, “Did you finish?” → She asked me ___ I had finished.","that|if|what|when",1,"Câu hỏi Yes/No → if/whether."],
["B2","“Please sit down,” he said. → He asked me ___ down.","to sit|sit|sitting|that I sit",0,"asked + O + to V."],
["B2","“I saw her yesterday.” → He said he ___ her the day before.","saw|had seen|has seen|sees",1,"QKĐ → QKHT; yesterday → the day before."],
["C1","“Let’s go swimming,” she said. → She ___ going swimming.","suggested|told|asked|ordered",0,"suggest + V-ing."],
["C1","“You should see a doctor.” → He ___ me to see a doctor.","advised|suggested|admitted|denied",0,"advise + O + to V."],
["C2","He accused me ___ the window.","of breaking|to break|for breaking|breaking",0,"accuse sb of V-ing."],
["C2","“If I were you, I would apologize.” → He said that if he ___ me, he would apologize.","were|had been|was being|is",0,"Điều kiện loại 2 giữ nguyên khi tường thuật."]]},
{n:"Relative Clauses & Inversion",i:"🔗",les:"<p><b>who</b> (người, chủ ngữ) · <b>whom</b> (người, tân ngữ) · <b>which</b> (vật) · <b>whose</b> (sở hữu, + danh từ) · <b>that</b> (người/vật; không dùng sau dấu phẩy hay giới từ). Trạng từ: <b>when</b> (thời gian), <b>where</b> (nơi chốn), <b>why</b> (lý do).</p><p><b>Rút gọn:</b> chủ động → V-ing · bị động → PP · có số thứ tự/only → to V.</p><p><b>Đảo ngữ (C2):</b> Hardly/Scarcely + had S PP + when… · No sooner + had S PP + than… · Not only + trợ động từ + S… · Rarely/Seldom/Never + trợ động từ + S…</p>",
q:[["B1","The man ___ lives next door is a doctor.","who|whom|which|whose",0,"Người + chủ ngữ → who."],
["B2","The girl ___ bag was stolen cried.","who|whom|which|whose",3,"Sở hữu (bag của cô gái) → whose."],
["B2","I remember the day ___ we met.","which|when|where|who",1,"Chỉ thời gian → when."],
["C1","The book ___ on the table is mine.","lying|lies|lay|to lie",0,"Rút gọn chủ động: which lies → lying."],
["C2","Hardly ___ the door when the phone rang.","I opened|had I opened|did I open|I had opened",1,"Hardly + had + S + PP + when."],
["C2","Not only ___ late, but he also forgot the files.","he arrived|did he arrive|he did arrive|arrived he",1,"Not only + trợ động từ + S + V."],
["C2","Rarely ___ such a beautiful view.","I have seen|have I seen|I saw|did I seen",1,"Rarely đứng đầu → đảo trợ động từ."],
["B1","This is the house ___ I was born.","which|where|who|whose",1,"Nơi chốn → where."],
["B2","The woman, ___ I met yesterday, is a teacher.","whom|that|which|whose",0,"Có dấu phẩy, tân ngữ chỉ người → whom (không dùng that)."],
["B2","The book, ___ was published last year, is a bestseller.","that|which|who|whom",1,"Mệnh đề không xác định → which."],
["C1","The letters ___ yesterday were lost.","sent|sending|to send|sends",0,"Rút gọn bị động → PP."],
["C1","He is the first student ___ the exam.","finishing|to finish|finished|who finishing",1,"Sau số thứ tự → to V."],
["C2","Seldom ___ about his salary.","he complains|does he complain|he does complain|did he complains",1,"Seldom + trợ động từ + S + V."],
["C2","No sooner had she sat down ___ the phone rang.","when|than|then|that",1,"No sooner … than; Hardly … when."],
["C2","Only after the meeting ended ___ the problem.","he realised|did he realise|he did realise|realised he",1,"Only after + mệnh đề → đảo ngữ ở mệnh đề chính."]]},
{n:"Vocabulary B1–B2",i:"📘",les:"<p><b>Chủ đề:</b> Education, Technology, Environment, Health, Travel, Lifestyle, Social Issues.</p><p><b>Mẹo:</b> học theo cụm &amp; họ từ (environment → environmental → environmentally). Hậu tố: -tion/-ness/-ment (danh từ), -ful/-ous/-al (tính từ), -ly (trạng từ), -ize/-en (động từ). Tiền tố phủ định: un-, im-, in-, dis-.</p><p><b>Bẫy:</b> xác định từ loại cần điền trước (sau tính từ sở hữu → danh từ).</p>",
q:[["B1","Synonym of “huge”:","tiny|enormous|quiet|narrow",1,"huge ≈ enormous (rất lớn)."],
["B1","Antonym of “increase”:","rise|reduce|grow|expand",1,"increase ↔ reduce/decrease."],
["B2","Pollution is a serious ___ problem.","environment|environmental|environmentally|environmentalist",1,"Trước danh từ cần tính từ → environmental."],
["B2","Her ___ to learn impressed the teacher.","willing|willingness|willingly|unwilling",1,"Sau “her” cần danh từ → willingness."],
["B2","“Sustainable” means:","able to continue without harming the environment|very expensive|changing quickly|against the law",0,"sustainable = bền vững."],
["B1","Synonym of “begin”:","start|finish|stop|end",0,"begin ≈ start."],
["B1","Antonym of “expensive”:","costly|cheap|rich|valuable",1,"expensive ↔ cheap."],
["B2","Synonym of “crucial”:","minor|vital|optional|rare",1,"crucial ≈ vital."],
["B2","Her ___ in maths won her a scholarship.","excel|excellent|excellence|excellently",2,"Sau tính từ sở hữu → danh từ."],
["B2","Many people are ___ about online privacy.","concern|concerned|concerning|concernedly",1,"be concerned about."],
["B2","The ___ of the Internet has changed education.","invent|invention|inventive|inventor",1,"The + danh từ chỉ sự vật → invention."]]},
{n:"Vocabulary C1–C2",i:"🎓",les:"<p><b>Academic:</b> hypothesis, correlation, mitigate, scrutinize, substantiate. <b>Formal:</b> commence (start), purchase (buy), deteriorate (get worse). <b>Debate:</b> I beg to differ · It is widely acknowledged that… · a compelling argument. <b>Research:</b> methodology, findings, empirical, cogent. <b>IELTS:</b> ubiquitous, detrimental, ameliorate, inevitable.</p><p><b>Mẹo:</b> đoán nghĩa qua gốc từ và sắc thái (tích cực/tiêu cực).</p>",
q:[["C1","Closest in meaning to “mitigate”:","worsen|alleviate|ignore|ignite",1,"mitigate = làm giảm nhẹ ≈ alleviate."],
["C1","Formal equivalent of “get worse”:","deteriorate|flourish|emerge|persist",0,"deteriorate = xấu đi."],
["C2","Her argument was ___, leaving no room for doubt.","cogent|fragile|ambiguous|trivial",0,"cogent = thuyết phục, chặt chẽ."],
["C2","“Ubiquitous” means:","rare|found everywhere|ancient|harmful",1,"ubiquitous = có mặt khắp nơi."],
["C2","“I beg to ___ with you on that point.”","differ|agree|argue|object",0,"beg to differ = lịch sự bày tỏ không đồng ý."],
["C1","Closest to “scrutinize”:","examine closely|ignore|admire|forget",0,"scrutinize = xem xét kỹ."],
["C1","Evidence ___ the theory that sleep improves memory.","substantiates|dismantles|conceals|ignores",0,"substantiate = chứng minh."],
["C1","Formal equivalent of “start”:","commence|conclude|postpone|hesitate",0,"commence = bắt đầu."],
["C2","Antonym of “ameliorate”:","improve|exacerbate|alleviate|enhance",1,"ameliorate (cải thiện) ↔ exacerbate (làm trầm trọng)."],
["C2","Smartphone overuse is ___ to teenagers’ concentration.","beneficial|detrimental|negligible|indispensable",1,"detrimental = có hại."],
["C2","A(n) ___ study relies on observation and data.","hypothetical|empirical|rhetorical|nominal",1,"empirical = thực nghiệm."]]},
{n:"Collocations & Phrasal Verbs",i:"🧩",les:"<p><b>make:</b> a mistake, a decision, progress, money · <b>do:</b> homework, research, harm, business · <b>take:</b> a break, advantage of, place, part in · <b>have:</b> a look, a rest, an effect · <b>give:</b> rise to, a speech, advice · <b>get:</b> better, a job, ready.</p><p><b>Phrasal:</b> put off (hoãn) · carry out (tiến hành) · bring about (gây ra) · look into (điều tra) · come across (tình cờ gặp) · run out of (hết).</p>",
q:[["B1","Don’t ___ a mistake in the test.","do|make|take|have",1,"make a mistake."],
["B2","You should ___ advantage of this chance.","make|take|have|get",1,"take advantage of."],
["B2","We had to ___ the meeting because of the storm.","put off|put on|carry out|run out of",0,"put off = hoãn lại."],
["B2","The scientists will ___ an experiment next week.","carry out|look into|come across|bring about",0,"carry out an experiment = tiến hành."],

{n:"Collocation, Idiom & CLIL",i:"🧠",pass2:"The greenhouse effect is a natural process in which gases such as carbon dioxide trap heat in the atmosphere. Without it, Earth would be too cold for life. However, burning fossil fuels releases extra greenhouse gases, so the planet is warming faster than ecosystems can adapt.",pass3:"Ecotourism aims to protect natural areas while benefiting local communities. Tourists stay in eco-lodges, join guided treks and buy local crafts. By contrast, mass tourism often damages habitats and increases waste.",les:"<p><b>Collocation theo động từ:</b> <i>make</i> a difference / a decision / progress · <i>do</i> research / harm / the laundry · <i>take</i> responsibility for / part in / care of · <i>have</i> an impact on / access to · <i>pay</i> attention to · <i>play</i> an important role · <i>raise</i> awareness / money · <i>gain</i> experience · <i>suffer</i> from.</p><p><b>Idiom theo chủ đề:</b> a piece of cake (dễ đợi) · under the weather (mệt ốm) · burn the midnight oil (thức khuya học) · break the ice · see eye to eye (đồng quan điểm) · a drop in the ocean (muối bỏ biển) · in the same boat · go the extra mile.</p><p><b>CLIL (học tiếng Anh qua nội dung Khoa học, Địa lý, công dân):</b> học từ vựng trong bối cảnh đoạn văn. Nắm từ nối học thuật: <i>however, by contrast, as a result, in addition, therefore</i>.</p>",

{n:"Đoán từ qua ngữ cảnh",i:"🔍",les:"<p><b>4 manh mối để đoán nghĩa:</b></p><p>1) <b>Đồng nghĩa / giải thích</b> ngay cạnh từ (A, which means B). 2) <b>Trái nghĩa</b> sau unlike, but, however, whereas. 3) <b>Nguyên nhân – kết quả</b> (so, because, therefore). 4) <b>Ví dụ</b> (such as, like) và <b>từ loại</b> (đứng sau a/the → danh từ, sau to → động từ).</p><p><b>Bẫy:</b> chọn nghĩa quen thuộc nhưng sai ngữ cảnh. Luôn thay nghĩa vừa chọn vào câu để kiểm tra.</p>",

{n:"Từ loại & Word family",i:"🔤",les:"<p><b>Danh từ (N):</b> sau a/the/tính từ sở hữu/tính từ; làm chủ ngữ/tân ngữ. Hint: -tion, -ment, -ness, -ity, -ance/-ence, -ship, -er/-or/-ist (người).</p><p><b>Động từ (V):</b> sau chủ ngữ, sau to/modal. Hint: -ize/-ise, -en, -ify, -ate, en-.</p><p><b>Tính từ (Adj):</b> trước N, sau be/seem/become/feel/look. Hint: -al, -ful, -ous, -ive, -able/-ible, -ic, -ent/-ant, -less, -y.</p><p><b>Trạng từ (Adv):</b> bổ nghĩa V, Adj, cả câu. Hint: -ly (ngoại lệ: fast, hard, late, well).</p><p><b>Mẹo 3 giây:</b> nhìn từ trước chỗ trống → quyết định loại từ → chọn đuôi từ. Tiền tố phủ định: un-, in-, im-, il-, ir-, dis-, mis-.</p>",

["M","3. Câu điều kiện","<p><b>Mẹo 0-1-2-3:</b></p><p>Type 0: If + HT, HT (chân lý) · Type 1: If + HT, will V (có thể) · Type 2: If + QKĐ (were), would V (không thật hiện tại) · Type 3: If + had PP, would have PP (trái quá khứ).</p><p>unless = if … not. Không dùng would sau if.</p>"],
["M","4. Câu tường thuật","<p>Lùi thì 1 bậc · đổi đại từ theo người nói · now→then, today→that day, tomorrow→the next day, yesterday→the day before, here→there, this→that.</p><p>Yes/No: if/whether + S V · Wh-: Wh + S V (không đảo) · Mệnh lệnh: told O (not) to V.</p><p><b>Không lùi:</b> chân lý, sự thật hiển nhiên.</p>"],
["M","5. Mệnh đề quan hệ","<p>who (người, chủ ngữ) · whom (người, tân ngữ) · which (vật) · whose + N (sở hữu) · that (xác định) · where/when/why.</p><p><b>Mẹo:</b> có dấu phẩy hoặc sau giới từ → không dùng that. Rút gọn: V-ing (chủ động), PP (bị động), to V (the first/only).</p>"],
["M","6. V-ing hay to V","<p><b>+ V-ing:</b> enjoy, avoid, finish, suggest, mind, deny, keep, practise; sau giới từ.</p><p><b>+ to V:</b> decide, hope, want, plan, refuse, promise, manage, afford.</p><p><b>Đổi nghĩa:</b> stop, remember, forget, try (remember to lock = nhớ để làm; remember locking = nhớ đã làm).</p>"],
["M","7. So sánh","<p>Ngắn: -er/-est · dài: more/most · as … as · the + so sánh hơn, the + so sánh hơn (càng … càng).</p><p>Bất quy tắc: good–better–best, bad–worse–worst, far–farther/further.</p><p><b>Bẫy:</b> không dùng more + tính từ thêm -er.</p>"],
["M","8. Động từ khuyết thiếu","<p>must (bắt buộc/chắc chắn) · should (khuyên) · may/might (có thể) · can’t (chắc chắn không) · had better V.</p><p><b>Modal + have PP:</b> should have PP (lẽ ra nên) · may have PP (có lẽ đã) · must have PP (chắc hẳn đã).</p>"],
["C","1. Đảo ngữ","<p>Từ phủ định/hạn định đứng đầu → đảo trợ động từ: never, rarely, seldom, little, not only, not until, only after/when/by.</p><p><b>Hardly had S PP when</b> · <b>No sooner had S PP than</b> · Not only does S V, but S also V.</p>"],
["C","2. Điều kiện hỗn hợp &amp; wish","<p>Mixed 3→2: If had PP, would V (nay). Mixed 2→3: If QKĐ, would have PP.</p><p>Đảo: Had / Were / Should + S … · But for = Had it not been for.</p><p><b>Wish:</b> hiện tại → QKĐ (were); quá khứ → had PP; phàn nàn/tương lai → would V. It’s (high) time + QKĐ.</p>"],
["C","3. Giả định (Subjunctive)","<p>suggest/insist/demand/require/recommend + that S (should) + V nguyên mẫu. It is essential/vital/important that S (should) V.</p><p>would rather + S + QKĐ (nói về hiện tại).</p>"],
["C","4. Rút gọn mệnh đề","<p>Cùng chủ ngữ: V-ing (chủ động, đồng thời) · Having PP (xảy ra trước) · PP (bị động).</p><p>Having finished, she left. · Built in 1900, the bridge is old.</p><p><b>Bẫy:</b> chủ ngữ treo (dangling) – chủ ngữ hai vế phải trùng nhau.</p>"],
["C","5. Câu chẻ (Cleft)","<p>It is/was + thông tin nhấn mạnh + that/who …</p><p>What + S + V + is/was … (What I need is time.)</p><p>Dùng để nhấn mạnh chủ ngữ, tân ngữ, trạng ngữ.</p>"],
["C","6. Nhượng bộ &amp; liên kết","<p>although/though + mệnh đề · despite/in spite of + N/V-ing (+ the fact that) · however/nevertheless/nonetheless (có dấu chấm, phẩy) · whereas/while: đối lập · no matter how/what.</p><p><b>Bẫy:</b> không dùng although + but.</p>"],
["C","7. Bị động nâng cao","<p>It is said that … · S is said to V (cùng thời) / to have PP (xảy ra trước).</p><p>need V-ing = need to be PP · have/get sth PP · be supposed to V.</p>"],
["C","8. Danh hóa &amp; cấu trúc nâng cao","<p>Danh hóa (viết học thuật): prices rise → a rise in prices; decide → the decision.</p><p>so … that, such … that, too … to, enough … to, the more … the more, either … or / neither … nor (chia động từ theo chủ ngữ gần nhất).</p>"]];

{t:"Part 4 – Sắp xếp email / thư (2 bài)",d:"Chọn số thứ tự 1–5 cho mỗi câu để thành email/thư hoàn chỉnh (Units 1, 2).",k:"o",it:[{t:"Bài 1 – Email (Family life)",s:["Dear Linh,","Thanks for your email. You asked how my family shares the housework.","My mother cooks, my father does the laundry, and I wash the dishes every evening.","We think sharing chores makes our family bonds stronger.","Write back and tell me about your family. Best wishes, Mai"]},{t:"Bài 2 – Letter (Humans and the environment)",s:["Dear Mr Hung,","I am writing to suggest some ways to protect our environment.","Firstly, our school should reduce plastic by using refillable bottles.","Secondly, students could plant trees and turn off lights when leaving rooms.","I hope you will consider my ideas. Yours sincerely, Nam"]}]},
{t:"Part 5 – Viết lại câu (4 câu)",d:"Viết phần còn thiếu, viết đầy đủ, không viết tắt. Bị động · be going to · chuyển đổi tương đương · let/make/allow.",k:"r",it:[["People use plastic bags to carry goods. → Plastic bags ___.",["are used to carry goods"],"are used to carry goods"],["I plan to join the school choir next month. → I ___ the school choir next month.",["am going to join","im going to join"],"am going to join"],["The room was so noisy that we couldn’t study. → The room was too noisy ___.",["for us to study","to study"],"for us to study"],["My parents allow me to stay up late at weekends. → My parents let me ___ at weekends.",["stay up late"],"stay up late"]]},
{t:"Part 6 – Reading (5 câu)",d:"Main idea, scanning, từ vựng, tham chiếu (Unit 1).",k:"m",p:"Many teenagers think housework is boring, but it brings real benefits. When children help with chores, they learn life skills such as cooking, cleaning and managing time. Doing housework also teaches responsibility, because everyone in the family depends on each other. In addition, sharing chores gives parents more free time to spend with their children, so family bonds become stronger. However, chores should never take too much time from studying. Parents should therefore divide tasks fairly and choose jobs that suit the child’s age.",it:[["What is the main idea of the passage?","Housework brings benefits when tasks are shared fairly.|Teenagers hate chores.|Parents should not work.|Studying is unimportant.",0,"Main idea: lợi ích + chia việc hợp lý."],["Which skill is NOT mentioned?","Playing sports|Cooking|Cleaning|Managing time",0,"Scanning: không có playing sports."],["Why do family bonds become stronger?","Parents have more free time with children|Children study more|Chores are boring|Teenagers earn money",0,"Scanning câu In addition."],["“depends on” is closest to:","relies on|argues with|looks after|gets rid of",0,"depend on = rely on."],["The word “they” (line 2) refers to:","children|parents|chores|skills",0,"Reference: When children help … they."]]},

{t:"Part 8 – Listening: Multiple choice (5 câu)",d:"Bấm ▶ Nghe (nghe 2 lần, giọng Anh–Anh). Units 1, 3.",k:"m",sc:"Hi, I’m Mai. I live in Hue with my parents and my younger brother. In my family, everyone shares the housework. My father cooks dinner because he finishes work early. My mother does the shopping on Saturdays. My brother takes out the rubbish, and I wash the dishes after dinner. On Sundays we clean the house together for about an hour. After that, I go to my music class at three o’clock. I play the piano, and I am learning to sing folk songs. Next month, I am going to perform at a charity concert with my class.",it:[["Where does Mai live?","Hue|Hanoi|Da Nang|Ho Chi Minh City",0,"I live in Hue."],["Who cooks dinner?","Her father|Her mother|Her brother|Mai",0,"My father cooks dinner."],["What does her brother do?","Takes out the rubbish|Washes the dishes|Cooks dinner|Does the shopping",0,"My brother takes out the rubbish."],["What time is her music class on Sunday?","3 o’clock|2 o’clock|4 o’clock|5 o’clock",0,"at three o’clock."],["What will Mai do next month?","Perform at a charity concert|Take an exam|Travel abroad|Buy a piano",0,"I am going to perform at a charity concert."]]},
